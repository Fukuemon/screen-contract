name: Docs

# 文書のチェック (CONTRIBUTING.md の「文書を直すとき」)。
# branches は "**" で受けて job 側で絞る (on ではブランチ名を動的に解決できない)。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.ref_name == github.event.repository.default_branch
    steps:
      # list-drift.mjs が Git の履歴を全部読む
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node.js と apm の版は mise.toml にある
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - run: pnpm install --frozen-lockfile

      # docs のチェックは apm の配置先にあり、Git で追跡しない
      - run: apm install --frozen

      # 既存の文書の指摘は残っている。pull request で変えた Markdown だけを見る
      - name: textlint
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- '*.md' > changed.txt
          if [ -s changed.txt ]; then xargs pnpm exec textlint < changed.txt; fi
      - run: node .claude/hooks/docs/hooks/check-history.mjs
      - run: node .claude/hooks/docs/hooks/check-links.mjs

      # 実装が変わった文書の一覧。失敗にはしない
      - run: node .claude/hooks/docs/hooks/list-drift.mjs
        continue-on-error: true
