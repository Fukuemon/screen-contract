# 消費 repo 向け git hooks (sdd-template が配布する初期値)。
# link.sh が消費 repo に「無い場合だけ」コピーする。以後は消費 repo が所有・編集してよい。
# テンプレ側の lefthook.yml とは別物 (check-skills 等のテンプレ著作用検査は含めない)。
# 有効化: npx lefthook install

pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    # 配布物の hooks/format/run_prettier.sh は使わない。整形後に
    # `git add <ファイル全体>` するため、部分 stage したファイルの未 stage 変更まで
    # commit に巻き込む。lefthook の stage_fixed で同じことを安全に行う。
    # (配布物はテンプレ側でのみ編集できるため、ここで置き換えている)
    prettier:
      glob: "*.{md,yml,yaml,json,css}"
      run: pnpm exec prettier --write --ignore-unknown -- {staged_files}
      stage_fixed: true
    # TypeScript / JavaScript の整形と lint。prettier は .prettierignore で
    # これらを除外しており、ここが担当する (context/engineering.md)。
    # 型検査は入れない。TypeScript 7 は tsc にファイルパスを渡せないため、
    # 変更ファイルだけの型検査が組めない (context/toolchain.md)。
    # 整形した結果だけを stage_fixed で staging へ戻す。明示的な git add を使うと、
    # 部分 stage したファイルの未 stage 変更まで commit に巻き込む。
    # `--` はオプション終端。ファイル名がハイフンで始まってもオプションと解釈させない。
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs}"
      run: pnpm exec oxfmt --ignore-path .oxfmtignore -- {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs}"
      run: pnpm exec oxlint -- {staged_files}

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push
    # 秒オーダーの検査はここへ置く (context/engineering.md の Root Task Boundary)。
    # check は lint (oxlint + 型検査) / format / test / build を通す。
    check:
      run: pnpm check
    # boundaries は内部で build してから走る。dist が無いとパッケージ間の辺が
    # 解決できず、違反ゼロで空振りするためである。
    boundaries:
      run: pnpm boundaries
    knip:
      run: pnpm knip

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
    # AI の attribution trailer を落とす。.claude/settings.json で無効化して
    # いるが、それでも入った commit が 332 件積み上がったため機械検査を置く。
    no-ai-attribution:
      run: bash hooks/commit-msg/check_no_ai_attribution.sh {1}

# git worktree を作った直後に共有プロセス層を繋ぐ。
# 配布は symlink で追跡されないため、worktree には配布物が 1 つも来ない。
# 手当てしないと hook が silent に no-op になる。
post-checkout:
  commands:
    link-worktree:
      run: bash scripts/link-worktree.sh
