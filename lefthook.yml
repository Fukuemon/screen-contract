# git hooks。有効化: pnpm install (prepare が lefthook install を実行する)

# node を要求するコマンドは scripts/run-with-node.sh 経由で呼ぶ。
# git hook は mise が activate されていないシェルで動くため、素で叩くと
# システムの Node が使われ、dependency-cruiser が起動を拒否する。

pre-commit:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-commit
    # 整形した結果だけを stage_fixed で staging へ戻す。明示的な git add を使うと、
    # 部分 stage したファイルの未 stage 変更まで commit に巻き込む。
    prettier:
      glob: "*.{md,yml,yaml,json,css}"
      run: sh scripts/run-with-node.sh pnpm exec prettier --write --ignore-unknown -- {staged_files}
      stage_fixed: true
    # TypeScript / JavaScript の整形と lint。prettier は .prettierignore で
    # これらを除外しており、ここが担当する (context/conventions.md の Shared Configuration)。
    # 型検査は入れない。TypeScript 7 は tsc にファイルパスを渡せないため、
    # 変更ファイルだけの型検査が組めない (context/tech-stack.md の Upgrade Checks)。
    # 整形した結果だけを stage_fixed で staging へ戻す。明示的な git add を使うと、
    # 部分 stage したファイルの未 stage 変更まで commit に巻き込む。
    # `--` はオプション終端。ファイル名がハイフンで始まってもオプションと解釈させない。
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs}"
      run: sh scripts/run-with-node.sh pnpm exec oxfmt --ignore-path .oxfmtignore -- {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs}"
      run: sh scripts/run-with-node.sh pnpm exec oxlint -- {staged_files}
    # 文章の規則。経緯の混入とリンクは編集後のフックと CI が見る
    textlint:
      glob: "*.md"
      run: sh scripts/run-with-node.sh pnpm exec textlint {staged_files}

pre-push:
  commands:
    protected-branch:
      run: python3 hooks/protected-branch/git_hook.py pre-push
    # 秒オーダーの検査はここへ置く (context/conventions.md の Shared Configuration)。
    # check は lint (oxlint + 型検査) / format / test / build を通す。
    check:
      run: sh scripts/run-with-node.sh pnpm check
    # boundaries は内部で build してから走る。dist が無いとパッケージ間の辺が
    # 解決できず、違反ゼロで空振りするためである。
    boundaries:
      run: sh scripts/run-with-node.sh pnpm boundaries
    knip:
      run: sh scripts/run-with-node.sh pnpm knip

commit-msg:
  commands:
    ticket-number:
      glob: "**/*"
      run: hooks/commit-msg/check_ticket_number.sh {1}
    # 形式と AI の帰属表示の禁止は commitlint.config.mjs が持つ
    commitlint:
      run: sh scripts/run-with-node.sh pnpm exec commitlint --edit {1}
